plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.eightkplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.eightkplayer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Keep APK size manageable – only arm64 for 8K devices
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ExoPlayer core + UI
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'

    // --- OFFICIAL SOFTWARE EXTENSIONS ---
    // AV1, VP9, FLAC, Opus, MIDI, IAMF, MPEG-H
    implementation 'com.google.android.exoplayer:exoplayer-ext-av1:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ext-vp9:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ext-flac:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ext-opus:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ext-midi:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ext-iamf:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ext-mpegh:2.19.1'

    // --- STANDARD FFMPEG (Vorbis, Opus, FLAC) ---
    // This builds immediately on GitHub Actions – no custom AAR needed.
    implementation 'com.google.android.exoplayer:exoplayer-ext-ffmpeg:2.19.1'

    // Media session & preferences
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
